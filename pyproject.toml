[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wetware-computing-platform"
version = "0.1.0"
description = "Offline simulation-first spiking reservoir for wetware-computing research"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wetware-simulate = "wetware_platform.cli:main"

[tool.setuptools.packages.find]
where = ["."]
